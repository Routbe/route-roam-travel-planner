\* Concurrency (safety + liveness): two sessions racing without faults; every
\* pending ceremony ends and every session comes back to rest.
CONSTANTS
  MaxCeremonies = 3
  MaxStepUps = 2
  UseCAS = TRUE
  RotateGen = TRUE
  RequireDowngradeStepUp = TRUE
  RequireCardConfirm = TRUE
  UseIdempotency = TRUE
  Clients = {c1, c2}
  MaxReq = 3
  MaxFaults = 0
SPECIFICATION Spec
INVARIANTS TypeOK Exclusivity LevelConsistent StrictThreshold NoHalfOpen NoSplitBrain NoFalseFailure Recoverable
PROPERTIES AuthorizedDowngrade CardNeverDegrades ActiveOnlyByCommit CeremonyTerminates ClientsSettle
CHECK_DEADLOCK TRUE
