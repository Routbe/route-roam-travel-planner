\* Mutant: a new ceremony re-wraps the SAME master generation, so revoked shares keep opening it.
\* run-tlc.sh requires TLC to report: StrictThreshold
CONSTANTS
  Clients = {c1}
  MaxCeremonies = 3
  MaxStepUps = 2
  MaxReq = 4
  MaxFaults = 0
  UseCAS = TRUE
  RotateGen = FALSE
  RequireDowngradeStepUp = TRUE
  RequireCardConfirm = TRUE
  UseIdempotency = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK Exclusivity LevelConsistent StrictThreshold NoHalfOpen NoSplitBrain NoFalseFailure Recoverable
PROPERTIES AuthorizedDowngrade CardNeverDegrades ActiveOnlyByCommit
CHECK_DEADLOCK TRUE
