\* Mutant: two sessions decide on what they read earlier instead of FOR UPDATE + version CAS inside the transaction.
\* run-tlc.sh requires TLC to report: Exclusivity
CONSTANTS
  Clients = {c1, c2}
  MaxCeremonies = 3
  MaxStepUps = 2
  MaxReq = 3
  MaxFaults = 0
  UseCAS = FALSE
  RotateGen = TRUE
  RequireDowngradeStepUp = TRUE
  RequireCardConfirm = TRUE
  UseIdempotency = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK Exclusivity LevelConsistent StrictThreshold NoHalfOpen NoSplitBrain NoFalseFailure Recoverable
PROPERTIES AuthorizedDowngrade CardNeverDegrades ActiveOnlyByCommit
CHECK_DEADLOCK TRUE
