\* Mutant: a retried request is executed again instead of replaying the stored answer.
\* run-tlc.sh requires TLC to report: NoFalseFailure
CONSTANTS
  Clients = {c1}
  MaxCeremonies = 3
  MaxStepUps = 2
  MaxReq = 4
  MaxFaults = 1
  UseCAS = TRUE
  RotateGen = TRUE
  RequireDowngradeStepUp = TRUE
  RequireCardConfirm = TRUE
  UseIdempotency = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK Exclusivity LevelConsistent StrictThreshold NoHalfOpen NoSplitBrain NoFalseFailure Recoverable
PROPERTIES AuthorizedDowngrade CardNeverDegrades ActiveOnlyByCommit
CHECK_DEADLOCK TRUE
