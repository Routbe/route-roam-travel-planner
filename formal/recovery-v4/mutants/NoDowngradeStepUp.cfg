\* Mutant: a commit that lowers the level does not need a fresh step-up.
\* run-tlc.sh requires TLC to report: AuthorizedDowngrade
CONSTANTS
  Clients = {c1}
  MaxCeremonies = 3
  MaxStepUps = 2
  MaxReq = 4
  MaxFaults = 0
  UseCAS = TRUE
  RotateGen = TRUE
  RequireDowngradeStepUp = FALSE
  RequireCardConfirm = TRUE
  UseIdempotency = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK Exclusivity LevelConsistent StrictThreshold NoHalfOpen NoSplitBrain NoFalseFailure Recoverable
PROPERTIES AuthorizedDowngrade CardNeverDegrades ActiveOnlyByCommit
CHECK_DEADLOCK TRUE
