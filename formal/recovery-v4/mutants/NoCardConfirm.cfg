\* Mutant: a 3of4 commit does not need the card tap proof.
\* run-tlc.sh requires TLC to report: NoHalfOpen
CONSTANTS
  Clients = {c1}
  MaxCeremonies = 3
  MaxStepUps = 2
  MaxReq = 4
  MaxFaults = 0
  UseCAS = TRUE
  RotateGen = TRUE
  RequireDowngradeStepUp = TRUE
  RequireCardConfirm = FALSE
  UseIdempotency = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK Exclusivity LevelConsistent StrictThreshold NoHalfOpen NoSplitBrain NoFalseFailure Recoverable
PROPERTIES AuthorizedDowngrade CardNeverDegrades ActiveOnlyByCommit
CHECK_DEADLOCK TRUE
